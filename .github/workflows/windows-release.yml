name: Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Publish Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CosmoNote.csproj --runtime win-x64

      - name: Publish single-file Windows executable
        shell: pwsh
        run: |
          dotnet publish CosmoNote.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'publish/win-x64/CosmoNote.exe')) {
            throw 'Windows executable was not generated.'
          }

      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath 'CosmoNote-win-x64.zip' -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoNote-win-x64
          path: CosmoNote-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      # A push to main produces a downloadable Actions artifact.
      # Pushing a v* tag also publishes that same ZIP as a GitHub Release asset.
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' 'CosmoNote-win-x64.zip' `
            --title 'CosmoNote ${{ github.ref_name }}' `
            --generate-notes `
            --verify-tag
